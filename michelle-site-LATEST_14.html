<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelle</title>
<style>
  :root {
    --bg: #000; --fg: #f5f5f3; --dim: #8a8a86; --line: #232323;
    --sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.5;
         -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--fg); color: var(--bg); }

  header { position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; align-items: center;
           justify-content: space-between; padding: 20px 32px; mix-blend-mode: difference; }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; }
  nav a { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
          margin-left: 28px; color: var(--dim); transition: color .25s; }
  nav a:hover { color: var(--fg); }

  canvas#field { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; min-height: 100vh; }
  section { padding: 120px 32px; max-width: 1100px; margin: 0 auto; }
  .label { font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
           margin-bottom: 40px; display: flex; align-items: center; gap: 14px; }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--dim); }

  .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
          text-align: center; padding-top: 0; padding-bottom: 0; }
  .eyebrow { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 24px; }
  h1 { font-weight: 500; letter-spacing: -.04em; line-height: .95; font-size: clamp(40px, 8vw, 124px);
       text-shadow: 0 0 80px rgba(255,255,255,.25); }
  .tag { margin-top: 32px; font-size: clamp(18px, 2.1vw, 26px); color: #c9c9c5; max-width: 30em; }
  .tag em, .tag i { font-family: var(--serif); font-style: italic; color: var(--fg); }
  .scroll { position: absolute; bottom: 40px; font: 11px var(--mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }

  .about p { font-size: clamp(22px, 3vw, 38px); line-height: 1.3; letter-spacing: -.015em; max-width: 24em; }
  .about p + p { margin-top: 1em; color: var(--dim); font-size: 18px; line-height: 1.6; letter-spacing: 0; max-width: 34em; }

  .about p { max-width: 26em; }
  .about p + p { color: #b9b9b5; font-size: 19px; line-height: 1.7; max-width: 36em; }
  .causes { margin-top: 88px; }
  .causes .label { margin-bottom: 24px; }
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .cause { position: relative; background: #000; padding: 34px 34px 38px; min-height: 210px; overflow: hidden; transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .cause:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; }
  .cause::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
                   background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.16), transparent 65%); }
  .cause:hover::before { opacity: 1; }
  .cause > * { position: relative; }
  .cn { font: 12px var(--mono); letter-spacing: .12em; color: var(--dim); display: block; margin-bottom: 38px; transition: color .3s; }
  .cause h3 { font-weight: 500; font-size: clamp(22px, 2.6vw, 34px); letter-spacing: -.025em; line-height: 1.1; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .ct { margin-top: 14px; font-size: 16px; line-height: 1.6; color: #a9a9a5; max-width: 30em; transition: color .3s; }
  body:not(.editing) .cause:hover h3 { transform: translateX(10px); }
  .cause:hover .ct { color: #e6e6e2; } .cause:hover .cn { color: #fff; }
  .cause .mini { margin-top: 18px; }
  button.svc { display: block; width: 100%; text-align: left; font: inherit; color: inherit; border: 0; padding-bottom: 64px; }
  .svgo { position: absolute !important; left: 34px; bottom: 28px; font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); transition: color .3s, transform .3s; }
  .svc:hover .svgo, .svc.sel .svgo { color: #fff; transform: translateX(6px); }
  .svc.sel { box-shadow: inset 0 0 0 1px #fff; } .svc.sel .cn { color: #fff; }
  .svpanel:not(:empty) { margin-top: 40px; padding: 34px; border: 1px solid #3a3a3a; border-radius: 16px; background: rgba(0,0,0,.6); max-width: 860px; }
  .svpanel .tin { margin-top: 0; max-width: 620px; } .svpanel .fieldlabel { margin: 22px 0 10px; } .svpanel .tq { font-size: clamp(22px, 2.8vw, 34px); }
  .services .cause .fieldlabel { margin: 14px 0 6px; }
  .cause .like { position: absolute; top: 26px; right: 26px; display: flex; align-items: center; gap: 8px; font: 12px var(--mono); letter-spacing: .06em;
                 color: var(--dim); background: rgba(0,0,0,.4); border: 1px solid #3a3a3a; border-radius: 999px; padding: 8px 13px; transition: color .25s, background .25s, border-color .25s, transform .25s; }
  .cause .like { padding: 9px 12px; }
  .stat { position: absolute !important; top: 26px; right: 26px; font: 12px var(--mono); letter-spacing: .06em; color: #000; background: #fff; border-radius: 999px; padding: 7px 12px; }
  .dash { font: 12px var(--mono); letter-spacing: .04em; color: #c9c9c5; border: 1px dashed #555; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
  .like svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; transform-origin: 30% 90%; }
  .cause .like:hover { color: #fff; border-color: #fff; transform: translateY(-2px); }
  .cause .like.on { color: #000; background: #fff; border-color: #fff; }
  .like.on svg { fill: currentColor; }
  .like.pop svg { animation: thumb .7s cubic-bezier(.2,.7,.2,1); }
  @keyframes thumb { 30% { transform: rotate(-28deg) scale(1.7); } 60% { transform: rotate(10deg) scale(1.15); } }
  .like.pop span { animation: tickup .5s cubic-bezier(.2,.7,.2,1); display: inline-block; }
  @keyframes tickup { from { transform: translateY(10px); opacity: 0; } }
  .cause.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 1px #fff, inset 0 0 90px rgba(255,255,255,.35); } 100% { box-shadow: inset 0 0 0 1px transparent, inset 0 0 0 rgba(255,255,255,0); } }
  @media (max-width: 760px) { .cgrid { grid-template-columns: 1fr; } .cause { min-height: 0; padding: 28px 24px; } }
  .labsec { padding-top: 40px; padding-bottom: 60px; } .labsec .edu { margin-top: 0; }
  .labcv { width: 100%; height: 470px; display: block; border: 1px solid var(--line); border-radius: 16px; background: #000; touch-action: pan-y; margin-top: 14px; }
  .lab .gbtns { margin-top: 0; flex-wrap: wrap; } .lab .mini.on { background: #fff; color: #000; border-color: #fff; }
  .lab .gread { line-height: 1.6; max-width: 70em; }
  .web { width: 100%; display: block; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.55); }
  body.themed .web { background: #050505; }
  .we { stroke: #5a5a5a; stroke-width: 1; transition: stroke .25s, opacity .25s; }
  .we.soft { stroke-dasharray: 3 6; stroke: #444; }
  .wn { outline: none; transition: opacity .25s; animation: wnin .8s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes wnin { from { opacity: 0; } }
  .wn circle { fill: #050505; stroke: #fff; stroke-width: 1.4; transition: fill .25s, stroke-width .25s; }
  .wn text { fill: #d6d6d2; font-family: var(--sans); transition: fill .25s; }
  .wf { fill: #777; font-family: var(--mono); letter-spacing: .14em; }
  .wn:hover circle, .wn:focus circle { fill: #fff; }
  .web.hov .wn:not(.hi), .web.hov .wf { opacity: .22; } .web.hov .we:not(.hi) { opacity: .15; }
  .web.hov .we.hi { stroke: #fff; } .web.hov .wn.hi circle { stroke-width: 2.4; } .web.hov .wn.hi text { fill: #fff; }
  .wrow { grid-template-columns: 1.2fr 1fr 80px 1.4fr auto !important; padding: 12px 0 !important; }
  .edu { margin-top: 88px; }
  .plist .erow { grid-template-columns: 170px 1.3fr 1fr auto; padding: 17px 0; }
  .plist .ep { font-size: clamp(16px, 1.45vw, 19px); line-height: 1.35; }
  .plist .tools.add { justify-content: flex-start; }
  .plist + .plist { margin-top: 72px; }
  @media (max-width: 760px) { .plist .erow { grid-template-columns: 1fr; } }
  .edu .label { margin-bottom: 20px; }
  .erow { display: grid; grid-template-columns: 150px 1.15fr 1fr auto; gap: 28px; align-items: baseline; padding: 22px 0; border-top: 1px solid var(--line); }
  .erow:last-of-type { border-bottom: 1px solid var(--line); }
  .ey { font: 12px var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .ep { font-size: clamp(17px, 1.7vw, 21px); letter-spacing: -.01em; }
  .edg { font-size: 16px; color: #b9b9b5; }
  @media (max-width: 760px) { .erow { grid-template-columns: 1fr; gap: 6px; } }

  /* index rows */
  .row { display: grid; grid-template-columns: 70px 1fr auto; gap: 24px; align-items: baseline; border-top: 1px solid var(--line);
         padding: 28px 0; transition: opacity .3s, padding .35s; }
  .row:last-of-type { border-bottom: 1px solid var(--line); }
  .row .n, .row .y { font: 12px var(--mono); color: var(--dim); letter-spacing: .08em; }
  .row .y { font-size: 22px; transition: transform .4s, color .3s; display: inline-block; }
  .row h3, .pn b { font-weight: 800; text-transform: uppercase; font-size: clamp(30px, 6vw, 84px); letter-spacing: -.04em; line-height: 1;
            color: transparent; -webkit-text-stroke: 1px #fff; transition: transform .35s, color .3s; display: block; }
  .row p { color: var(--dim); font-size: 15px; margin-top: 6px; max-width: 36em; }
  body:not(.editing) .rows:hover .row { opacity: .35; }
  body:not(.editing) .rows:hover .row:hover { opacity: 1; }
  body:not(.editing) .row:hover h3 { color: #fff; transform: translateX(28px) skewX(-8deg); }
  body:not(.editing) .row:hover { padding: 44px 0; }
  body:not(.editing) .row:hover .y { transform: translateX(10px); color: var(--fg); }

  /* subpages */
  .page { padding-top: 150px; min-height: 100vh; }
  .pagetop { display: flex; justify-content: space-between; font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase;
             color: var(--dim); margin-bottom: 56px; }
  .pagetop a:hover { color: var(--fg); }
  .pagetitle { font-weight: 800; text-transform: uppercase; letter-spacing: -.05em; line-height: .9; text-shadow: none;
               font-size: clamp(44px, 10.5vw, 150px); overflow-wrap: anywhere; }
  .lead { margin-top: 36px; font-size: clamp(20px, 2.6vw, 32px); line-height: 1.3; letter-spacing: -.01em; color: #c9c9c5; max-width: 26em; }
  .page .body { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--line); max-width: 760px; }
  .body { font-size: 19px; line-height: 1.65; color: #d6d6d2; }
  .body p, .body div { margin-bottom: 1.1em; }
  .body b, .body strong { color: #fff; font-weight: 600; }
  .body a { border-bottom: 1px solid var(--dim); }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; font-size: 12px; }
  .tags li { font-family: var(--mono); letter-spacing: .04em; padding: 7px 13px; border: 1px solid #3a3a3a; border-radius: 999px;
             color: #cfcfcb; transition: background .25s, color .25s; }
  .tags li:hover { background: var(--fg); color: #000; }
  .pnwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 120px; border-top: 1px solid var(--line); padding-top: 36px; }
  .pn span { font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 12px; }
  .pn b { font-size: clamp(22px, 3.6vw, 48px); }
  .pn:hover b { color: #fff; }
  .pn.next { text-align: right; }

  .contact h2 { font-weight: 500; font-size: clamp(40px, 8vw, 110px); letter-spacing: -.04em; line-height: 1; }
  .links { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 12px 36px; font: 14px var(--mono); }
  .links a { position: relative; padding-bottom: 4px; }
  .links a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%; background: var(--fg);
                    transform: scaleX(0); transform-origin: right; transition: transform .35s; }
  .links a:hover::after { transform: scaleX(1); transform-origin: left; }
  footer { position: relative; z-index: 1; padding: 40px 32px 60px; text-align: center; font: 11px var(--mono); color: #555; letter-spacing: .1em; }
  #pnote { display: block; max-width: 60em; margin: 12px auto 0; letter-spacing: .04em; line-height: 1.7; text-transform: none; color: #5c5c5c; }
  footer button { font: inherit; letter-spacing: inherit; color: #555; background: none; border: 0; margin-left: 14px; text-transform: uppercase; }
  footer button:hover { color: var(--fg); }

  /* contact game */
  .game { margin-top: 44px; }
  .gstatus { font: 13px var(--mono); letter-spacing: .02em; color: #c9c9c5; margin-bottom: 16px; min-height: 1.5em; }
  .game svg { width: 100%; display: block; border: 1px solid var(--line); border-radius: 14px; background: #060606; touch-action: manipulation; }
  .node { outline: none; }
  .node .hit { fill: transparent; stroke: #fff; stroke-width: 1; stroke-dasharray: 3 5; stroke-opacity: .28; transition: stroke-opacity .2s, fill .2s; }
  .node:hover .hit, .node:focus-visible .hit { stroke-opacity: 1; fill: rgba(255,255,255,.08); }
  .string { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: butt; pointer-events: none; }
  .string.won { filter: drop-shadow(0 0 7px rgba(255,255,255,.9)); }
  .gap { fill: none; stroke: #060606; stroke-width: 16; stroke-linecap: butt; pointer-events: none; }
  .game svg.won .string, .game svg.won .ge.on { filter: drop-shadow(0 0 7px rgba(255,255,255,.9)); }
  .node .dot { fill: #060606; stroke: #fff; stroke-width: 1.6; transition: stroke-width .2s, fill .2s; }
  .node:hover .dot, .node:focus-visible .dot { stroke-width: 5; } .node.on .dot { fill: #fff; }
  .ge { stroke: #4a4a4a; stroke-width: 2; stroke-linecap: round; transition: stroke .25s, stroke-width .25s; pointer-events: none; }
  .ge.on { stroke: #fff; stroke-width: 4; }
  .ring { fill: none; stroke: #2a2a2a; stroke-width: 1; stroke-dasharray: 2 6; pointer-events: none; }
  .star { fill: #fff; filter: drop-shadow(0 0 14px rgba(255,255,255,.8)); pointer-events: none; }
  .planet { fill: #060606; stroke: #fff; stroke-width: 2; pointer-events: none; }
  .trail { stroke-width: 1.6; opacity: .8; }
  .rubber { fill: none; stroke: #9a9a9a; stroke-width: 1.4; stroke-dasharray: 5 7; pointer-events: none; }
  .gt { fill: #8a8a86; font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
  .gt.big { fill: #fff; font-size: 22px; letter-spacing: 0; }
  .gbtn .hit { stroke-dasharray: none; stroke-opacity: .45; }
  .gread { font: 12px var(--mono); letter-spacing: .06em; color: var(--dim); margin-top: 12px; }
  .game.fail svg { animation: shake .35s; border-color: #888; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .gbtns { display: flex; gap: 8px; margin-top: 14px; }
  .locked { display: none; }
  .cform { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 720px; }
  .cform label { font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: grid; gap: 8px; }
  .cform .wide { grid-column: 1 / -1; }
  .cform input, .cform textarea { font: 16px var(--sans); color: #fff; background: rgba(255,255,255,.03); border: 1px solid #333; border-radius: 10px;
        padding: 13px 14px; width: 100%; transition: border-color .2s; cursor: text; }
  .cform textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .cform input:focus, .cform textarea:focus { outline: none; border-color: #fff; }
  .cform .hp { position: absolute; left: -9999px; }
  .cform button { justify-self: start; font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #000; background: #fff;
        border: 1px solid #fff; border-radius: 999px; padding: 13px 26px; transition: background .25s, color .25s; }
  .cform button:hover { background: transparent; color: #fff; }
  .cform button:disabled { opacity: .5; }
  .duo { margin-top: 56px; border-top: 1px solid var(--line); padding-top: 40px; display: grid; grid-template-columns: minmax(0, .8fr) auto minmax(0, 1.5fr); gap: 44px; align-items: start; }
  .or { font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .or::before, .or::after { content: ""; width: 1px; flex: 1; background: var(--line); }
  .quick .tq { font-size: clamp(20px, 2.2vw, 28px); line-height: 1.25; }
  .quick .thead, .talk .thead { margin-bottom: 18px; }
  .ask { max-width: 1100px; }
  .ask .thead { margin-bottom: 22px; }
  .qtext { font-weight: 500; font-size: clamp(30px, 5vw, 66px); letter-spacing: -.035em; line-height: 1.06; max-width: 17em; min-height: 2.2em; margin-bottom: 30px; }
  .qtext.swap { animation: qswap .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes qswap { from { opacity: 0; transform: translateY(22px); filter: blur(8px); } }
  .ask .tin { max-width: 760px; } .ask input.tin { max-width: 380px; }
  .ask .thint { text-transform: none; letter-spacing: .02em; font-size: 12px; max-width: 52em; line-height: 1.6; }
  .pask .qtext { font-size: clamp(26px, 3.6vw, 46px); min-height: 0; margin-bottom: 22px; }
  .pask .tin { max-width: 760px; } .pask input.tin { max-width: 380px; } .pask .thint { text-transform: none; letter-spacing: .02em; font-size: 12px; }
  .talk .thead + .thead { margin-bottom: 28px; }
  @media (max-width: 860px) { .duo { grid-template-columns: 1fr; gap: 32px; } .or { flex-direction: row; } .or::before, .or::after { height: 1px; width: auto; } }
  .thead { display: flex; align-items: center; gap: 18px; font: 12px var(--mono); letter-spacing: .12em; color: var(--dim); margin-bottom: 28px; }
  .tprog { display: flex; align-items: center; }
  .tprog i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #666; position: relative; margin-right: 34px; transition: background .4s, border-color .4s, box-shadow .4s; }
  .tprog i:last-child { margin-right: 0; }
  .tprog i:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 3px; width: 34px; height: 1px; background: #444; }
  .tprog i.done { background: #fff; border-color: #fff; } .tprog i.done::after { background: #fff !important; }
  .tprog i.now { border-color: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.15); }
  .tq { font-weight: 500; font-size: clamp(26px, 3.6vw, 46px); letter-spacing: -.03em; line-height: 1.1; animation: rise .6s both; }
  .tbody { margin-top: 28px; animation: rise .6s .1s both; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font: 15px var(--sans); color: #fff; background: transparent; border: 1px solid #555; border-radius: 999px; padding: 11px 20px;
          transition: background .25s, color .25s, transform .25s, border-color .25s; }
  .chip:hover { border-color: #fff; transform: translateY(-3px); }
  .chip.on { background: #fff; color: #000; border-color: #fff; }
  .tin { display: block; width: 100%; font: 17px var(--sans); color: #fff; background: rgba(255,255,255,.03); border: 1px solid #333; border-radius: 12px;
         padding: 15px 16px; margin-top: 14px; transition: border-color .2s; cursor: text; }
  textarea.tin { min-height: 130px; resize: vertical; line-height: 1.5; }
  .tin:focus, .blank:focus { outline: none; border-color: #fff; }
  .mad { font-size: clamp(20px, 2.6vw, 32px); line-height: 1.7; color: #c9c9c5; letter-spacing: -.01em; }
  .blank { font: inherit; color: #fff; background: none; border: 0; border-bottom: 1px solid #777; padding: 0 4px 2px; max-width: 100%; cursor: text; }
  .blank::placeholder, .tin::placeholder { color: #666; }
  .tnav { display: flex; align-items: center; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .tgo { font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #000; background: #fff; border: 1px solid #fff; border-radius: 999px;
         padding: 13px 26px; transition: background .25s, color .25s; }
  .tgo:hover { background: transparent; color: #fff; } .tgo:disabled { opacity: .5; }
  .tnote { font: 13px var(--mono); color: #c9c9c5; }
  .thint { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #666; margin-top: 18px; }
  .gate .links { margin-top: 64px; }
  .cnote { font: 13px var(--mono); color: #c9c9c5; align-self: center; }

   "title": "Research",
   "desc": "Strings, knots, and the geometry inside quantum field theory.",
   "body": "<p>My work explores how quantum field theories, algebraic structures and geometry describe the same thing in different languages. I like problems that need topology, representation theory, gauge theory and string dualities all at once, and I like pressing past the slogan to the actual calculation.</p><p>My current work begins with Chern–Simons theory. In my master's thesis I studied its planar limit with very heavy Wilson lines and identified the D-branes in topological string theory that describe it, and I am now extending this from the cylinder to the torus and to general surfaces. Alongside it, I study how knot invariants and skein algebras behave when N becomes large, using the representation theory of quantum groups. In between, I spent a season on supersymmetric hydrodynamics, where superconformal algebras meet integrable systems.</p><p>At Berkeley I wrote two theses. The mathematics thesis explored 3d mirror symmetry: Koszul duality between Higgs and Coulomb branches, seen through Fukaya categories. The physics thesis studied M-theory on manifolds of G<sub>2</sub> holonomy and its connections to number theory. In the same years I worked at Caltech on BPS q-series as invariants of 3-manifolds, with resurgence and modularity, and at Perimeter on how the categorical symmetries of topological orders stack along defects. My very first project was on field theories far from equilibrium and string theory near the Hagedorn temperature.</p><p>I also enjoy detours. At the Wolfram Science Winter School I explored how to define vector fields on discrete graphs. And I am beginning to ask whether ideas from geometry, topological field theory and statistical physics can help us understand the inner workings of AI systems.</p>",

   "title": "Teaching",
   "desc": "Ambitious ideas, with a welcoming way in.",
   "body": "<p>I want to understand a hard idea well enough to teach it, and teaching is how I find out whether I do.</p><p>At Berkeley I created and co-taught three semester-long, student-run courses that bring graduate-level ideas to undergraduates: Topology and Geometry for Physics Students, Differential Geometry and Lie Groups for Physics Students, and Quantum Field Theory for Math Students. Each met for about three hours a week over a full term. I also co-taught Beginner's Guide to the Universe for three semesters, and was a reader for courses in Riemannian geometry, relativity, and quantum field theory.</p><p>Outside the university I teach short classes for high-school students, from \"What Is Topology?\" to \"Particles and Strings!\", along with a recurring class on the women behind major discoveries in mathematics and physics, and one on Suzhou language and culture. I have also taught three-week summer courses that travel from quantum mechanics and relativity to string theory.</p><p>I give talks often, because explaining my research to different audiences sharpens it. I believe ambitious material should be open to any motivated student, and that learning works best when it keeps your own reasoning and patience at the centre.</p>",

   "id": "s3",
   "title": "Community",
   "desc": "Building places where people explore hard ideas together.",
   "body": "<p>Physics is done by people, and people need places to belong. Alongside research, I have spent years building those places.</p><p>At Berkeley I served the Society of Physics Students for three years, as seminar co-chair, vice president, co-president and president. We ran weekly undergraduate seminars and faculty-student lunches, and the chapter was named a National Outstanding SPS Chapter in each of those years. I also helped rebuild the Society of Women in the Physical Sciences after the pandemic, into a group with regular meetings, a mentorship programme, speaker events and a symposium.</p><p>I was the undergraduate liaison on the local organizing committee of the 2025 APS Conference for Undergraduate Women and Gender Minorities in Physics, where I helped plan the programme and led five workshops. I organized research fairs that help students find their way into research, started a buddy system pairing Berkeley students with exchange students, and helped run Splash, which brings high-school students to campus for a day of classes.</p><p>Today I represent Perimeter in the University of Waterloo's physics graduate student association and keep mentoring younger students, after two years as an APS Student Ambassador. What I care about most is leaving behind something durable that makes it easier for the next person to take part.</p>",

   "desc": "Languages carry memory. I like collecting them.",
   "body": "<p>Suzhounese is my home language, alongside Mandarin and English. I've studied French, have a little Spanish, and have started Ancient Greek. Through Duolingo I am also learning a bit of Arabic, Hawaiian, Japanese, and Italian. I love comparing how languages are related and what cultures they carry.</p><p>Suzhou's gardens, canals, Kun opera and Pingtan storytelling are part of how I think. I care about regional languages surviving, and once taught a class on Suzhou language and culture.</p>",

          if (d > 0 && Math.abs(d - w.r) < 26) { var push = (1 - w.r / 520) * .9; p.vx += dx / d * push; p.vy += dy / d * push; }
        }
        p.vx *= .985; p.vy *= .985;
        if (Math.sqrt(p.vx * p.vx + p.vy * p.vy) < .12 * p.z) { p.vx += (Math.random() - .5) * .03; p.vy += (Math.random() - .5) * .03; }
        if (falling) { p.vy += .35 * p.z; p.vx *= .99; p.y += p.vy; }        /* the star field falls with everything else */
        if (pull) { p.vx += (W / 2 - p.sx) * .0045; p.vy += (H / 2 - p.sy) * .0045; p.vx *= .93; p.vy *= .93; }   /* collapse toward the centre */
        p.x += p.vx; p.y += p.vy;

      }
      var a = Math.min(1, .35 + .45 * p.z) * (still ? 1 : .72 + .28 * Math.sin(time * p.tw + p.ph));   /* twinkle */
      p.lx = p.sx; p.ly = p.sy; var mag = 1, ghost = false;
      if (lens) {                    /* gravitational lensing: a point-mass lens sits under the cursor */
        dx = p.sx - mouse.x; dy = p.sy - mouse.y; d = Math.sqrt(dx * dx + dy * dy) || .01;
        if (d < E * 7) {
          var rt2 = Math.sqrt(d * d + 4 * E * E), u = d / E, ra = (d + rt2) / 2;
          p.lx = mouse.x + dx / d * ra; p.ly = mouse.y + dy / d * ra;

      }
      ctx.fillStyle = 'rgba(' + INK + ',' + Math.min(1, a * mag) + ')'; ctx.beginPath(); ctx.arc(p.lx, p.ly, p.r * Math.sqrt(mag), 0, 6.283); ctx.fill();
      if (ghost) { ctx.fillStyle = 'rgba(' + INK + ',' + Math.min(.9, a * (mag - .6)) + ')'; ctx.beginPath(); ctx.arc(gx2, gy2, p.r * .85, 0, 6.283); ctx.fill(); }
    }
    ctx.lineWidth = .6;
    if (now - labSeen > 300)            /* while the lab is on screen, skip the costly background links */
    for (i = 0; i < pts.length; i++) for (j = i + 1; j < pts.length; j++) {
      p = pts[i]; q = pts[j]; dx = p.lx - q.lx; dy = p.ly - q.ly; d = dx * dx + dy * dy;
      if (d < 12100) { ctx.strokeStyle = 'rgba(' + INK + ',' + (1 - d / 12100) * .2 * Math.min(p.z, q.z, 1) + ')';
        ctx.beginPath(); ctx.moveTo(p.lx, p.ly); ctx.lineTo(q.lx, q.ly); ctx.stroke(); }
    }
    if (cups.length) {                                   /* tell each M and L where the cursor's circle is, so only the part inside it changes */
      var rad = cur.offsetWidth ? cur.offsetWidth / 2 : 45;
      for (i = 0; i < cups.length; i++) { var cr = cups[i].getBoundingClientRect(), st = cups[i].style;
        st.setProperty('--mx', (cx - cr.left).toFixed(1) + 'px'); st.setProperty('--my', (cy - cr.top).toFixed(1) + 'px'); st.setProperty('--r', rad.toFixed(1) + 'px'); }
    }
    if (sparks.length) {
      ctx.fillStyle = 'rgb(' + INK + ')';
      for (i = sparks.length - 1; i >= 0; i--) { p = sparks[i]; p.vy += .12; p.vx *= .97; p.vy *= .97; p.x += p.vx; p.y += p.vy; p.a -= .02;
        if (p.a <= 0) { sparks.splice(i, 1); continue; } ctx.globalAlpha = p.a; ctx.fillRect(p.x, p.y, 2.2, 2.2); }
      ctx.globalAlpha = 1;
    }
    if (intro) {
      var e = now - intro.t0;
      if ((e > 2100 || sy > 140) && !intro.rel) releaseIntro();
      ctx.fillStyle = 'rgb(' + INK + ')';
      for (i = 0; i < ip.length; i++) {
        p = ip[i];
        if (!intro.rel) { p.vx = (p.vx + (p.tx - p.x) * p.k) * .86; p.vy = (p.vy + (p.ty - p.y) * p.k) * .86; p.a = Math.min(1, p.a + .025); }
        else { p.vx *= .965; p.vy *= .965; p.a -= .013; }
        p.x += p.vx; p.y += p.vy;
        if (p.a > 0) { ctx.globalAlpha = p.a; ctx.fillRect(p.x, p.y, 1.7, 1.7); }
      }
      ctx.globalAlpha = 1;
      if (intro.rel && e > 4200) { intro = null; ip = []; }

      var hr = heroH1.parentNode.getBoundingClientRect(), EL = W < 700 ? 46 : 78;

        var l = letters[i]; if (!l.classList.contains('done')) continue;

        d = Math.sqrt(dx * dx + dy * dy) || .01;
        if (d < EL * 5) {
          var rt = Math.sqrt(d * d + 4 * EL * EL), r1 = (d + rt) / 2, disp = r1 - d, rad = .5 * (1 + d / rt), tan = Math.min(1.85, r1 / d), ang = Math.atan2(dy, dx);
          l.style.transform = 'translate(' + (dx / d * disp).toFixed(1) + 'px,' + (dy / d * disp).toFixed(1) + 'px) rotate(' + ang.toFixed(3) + 'rad) scale(' +
            rad.toFixed(3) + ',' + tan.toFixed(3) + ') rotate(' + (-ang).toFixed(3) + 'rad)';
          var near = Math.max(0, 1 - d / (EL * 3));
          l.style.textShadow = '0 0 ' + (30 + near * 50) + 'px rgba(255,255,255,' + (.25 + near * .6).toFixed(2) + ')';
        } else { l.style.transform = ''; l.style.textShadow = ''; }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
  load();
})();
